<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiragana LipSync</title>
<style>
:root { --teal:#0F766E; --teal-h:#0B625C; --teal-p:#094E49; }
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#F6F8FB; color:#111827;
  font-family:"Segoe UI","Yu Gothic UI","Hiragino Sans",sans-serif;
  min-height:100vh; display:flex; justify-content:center; align-items:center;
}
#app { width:600px; max-width:94vw; padding:24px 30px; display:flex; flex-direction:column; gap:12px; }
#langs { display:flex; }
#langs button {
  background:#FFFFFF; border:1px solid #B8C4D0; color:#344054;
  font-size:12px; font-weight:700; min-height:30px; padding:0 12px; cursor:pointer;
}
#langs button:hover { background:#E8F1F0; }
#langs button.on { background:var(--teal); border-color:var(--teal); color:#FFFFFF; }
#drop {
  border:2px dashed #B8C4D0; min-height:150px; display:flex; flex-direction:column;
  justify-content:center; align-items:center; gap:8px; padding:26px 24px; text-align:center;
  cursor:pointer; transition:background .15s,border-color .15s;
}
#drop.active { background:rgba(15,118,110,.16); border-color:var(--teal); }
#dropTitle { color:#101828; font-size:16px; font-weight:700; white-space:pre-line; }
#dropPath { color:#344054; font-size:12px; word-break:break-all; }
#status { color:#344054; font-size:12px; min-height:16px; }
#run {
  background:var(--teal); border:1px solid var(--teal); color:#FFFFFF;
  font-size:14px; font-weight:700; min-height:44px; cursor:pointer;
}
#run:hover:enabled { background:var(--teal-h); border-color:var(--teal-h); }
#run:active:enabled { background:var(--teal-p); border-color:var(--teal-p); }
#run:disabled { background:#D6DCE4; border-color:#D6DCE4; color:#667085; cursor:default; }
#bar { background:#DCE3EA; height:6px; }
#fill { background:var(--teal); height:6px; width:0%; transition:width .15s; }
#settings { border:1px solid #DCE3EA; background:#FFFFFF; padding:16px 18px 6px; display:flex; flex-direction:column; }
#settingsHead { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #EEF2F6; }
#settingsTitle { color:#101828; font-size:13px; font-weight:700; letter-spacing:.02em; }
#reset { background:none; border:none; padding:2px; cursor:pointer; width:24px; height:24px; opacity:.65; transition:opacity .15s; }
#reset:hover { opacity:1; }
#reset img { width:20px; height:20px; display:block; }
.row { display:flex; align-items:center; gap:14px; min-height:42px; border-bottom:1px solid #EEF2F6; }
.row:last-child { border-bottom:none; }
.row label { color:#344054; font-size:12px; min-width:185px; flex-shrink:0; }
.row input[type=range] { flex:1; accent-color:var(--teal); height:4px; }
.row select { border:1px solid #B8C4D0; color:#344054; font-size:12px; padding:4px 8px; background:#FFFFFF; cursor:pointer; }
.row select:hover { border-color:var(--teal); }
.row input[type=checkbox] { width:16px; height:16px; accent-color:var(--teal); cursor:pointer; }
.row .val { color:#101828; font-size:12px; font-weight:700; min-width:30px; text-align:right; font-variant-numeric:tabular-nums; }
.mouthBlock { padding:10px 0 12px; border-bottom:1px solid #EEF2F6; }
.mouthBlock > label { display:block; color:#344054; font-size:12px; margin-bottom:8px; }
.mouthRow { display:flex; gap:14px; flex-wrap:wrap; }
.mouthItem { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; min-width:56px; }
.mouthItem span:first-child { color:#344054; font-size:12px; }
.mouthItem span:last-child { color:#101828; font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
.mouthItem input[type=range] { width:100%; accent-color:var(--teal); height:4px; }
#credit { color:#667085; font-size:11px; }
#engine { color:#667085; font-size:11px; min-height:14px; }
#credit a { color:var(--teal); }
input[type=file] { display:none; }
</style>
</head>

<div id="app">
  <div id="langs"></div>
  <div id="drop">
    <div id="dropTitle"></div>
    <div id="dropPath"></div>
  </div>
  <div id="status"></div>
  <button id="run" disabled></button>
  <div id="bar"><div id="fill"></div></div>
  <div id="engine"></div>
  <div id="settings">
    <div id="settingsHead">
      <div id="settingsTitle"></div>
      <button id="reset"><img src="img/reset_settings.svg"></button>
    </div>
    <div class="mouthBlock">
      <label id="mouthLabel"></label>
      <div class="mouthRow" id="mouthRow"></div>
    </div>
    <div class="row"><label id="leadLabel"></label><input type="range" id="lead" min="-30" max="30" step="1"><span class="val" id="leadVal"></span></div>
    <div class="row"><label id="shapesLabel"></label><input type="range" id="shapes" min="1" max="6" step="1"><span class="val" id="shapesVal"></span></div>
    <div class="row"><label id="intervalLabel"></label><select id="interval"><option value="10">10</option><option value="15">15</option><option value="30">30</option></select></div>
    <div class="row"><label id="eyeLabel"></label><input type="checkbox" id="eye"></div>
  </div>
  <div id="credit">Model: <a href="https://huggingface.co/TylorShine/wavlm-base-plus-hiragana-ctc-v2" target="_blank" rel="noopener">wavlm-base-plus-hiragana-ctc-v2</a> (CC BY-SA 3.0)<br>Eye Animation: <a href="https://booth.pm/ja/items/6123352" target="_blank" rel="noopener">「何もしない」まばたき＆呼吸モーション</a> かんな@MMD</div>
  <input type="file" id="picker" accept=".wav,.mp3,audio/wav,audio/mpeg">
</div>

    stride: 30 / Number(intervalEl.value),
    eye: eyeEl.checked
  };
}

leadEl.addEventListener("input", () => { leadValEl.textContent = leadEl.value; });
shapesEl.addEventListener("input", () => { shapesValEl.textContent = shapesEl.value; });
resetEl.addEventListener("click", applyDefaults);
applyDefaults();

for (const code of Object.keys(LANG)) {
  const b = document.createElement("button");
  b.textContent = LANG[code].name;
  b.dataset.code = code;
  b.addEventListener("click", () => { langCode = code; applyLanguage(); });
  langsEl.appendChild(b);
}

function setProgress(value) { fillEl.style.width = value + "%"; }

function setAudio(file) {
  const name = file.name.toLowerCase();
  if (!name.endsWith(".wav") && !name.endsWith(".mp3")) return;
  audioFile = file;
  dropTitleEl.textContent = file.name;
  dropPathEl.textContent = (file.size / 1e6).toFixed(2) + " MB";
  updateRunState();
}

function updateRunState() { runEl.disabled = running || !audioFile || !session; }

["dragenter","dragover"].forEach(type => document.addEventListener(type, e => {
  e.preventDefault(); dropEl.classList.add("active");
}));
["dragleave","drop"].forEach(type => document.addEventListener(type, e => {
  e.preventDefault(); dropEl.classList.remove("active");
}));
document.addEventListener("drop", e => {
  if (e.dataTransfer.files.length === 1) setAudio(e.dataTransfer.files[0]);
});
dropEl.addEventListener("click", () => pickerEl.click());
pickerEl.addEventListener("change", () => { if (pickerEl.files.length === 1) setAudio(pickerEl.files[0]); });

async function fetchParts() {
  const buffers = [];
  let total = 0;
  let loaded = 0;
  const heads = await Promise.all(MODEL_PARTS.map(p => fetch(p)));
  for (const r of heads) {
    if (!r.ok) throw new Error("fetch " + r.url + " " + r.status);
    const len = Number(r.headers.get("Content-Length") || 0);
    total += len;
  }
  for (const r of heads) {
    const reader = r.body.getReader();
    const chunks = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      if (total > 0) {
        const pct = Math.min(100, Math.floor(loaded / total * 100));
        setStatus("model_loading", " " + pct + "%");
        setProgress(pct);
      }
    }
    buffers.push(chunks);
  }
  let size = 0;
  for (const chunks of buffers) for (const c of chunks) size += c.length;
  const merged = new Uint8Array(size);
  let offset = 0;
  for (const chunks of buffers) for (const c of chunks) { merged.set(c, offset); offset += c.length; }
  return merged;
}

async function loadModel() {
  try {
    setStatus("model_loading");
    const bytes = await fetchParts();
    try {
      session = await ort.InferenceSession.create(bytes, { executionProviders: ["webgpu"] });
      engineName = "WebGPU";
    } catch (e) {
      session = await ort.InferenceSession.create(bytes, { executionProviders: ["wasm"] });
      engineName = "WASM (CPU)";
    }
    setStatus("model_ready");
    engineEl.textContent = "Engine: " + engineName;
    setProgress(0);
    updateRunState();
  } catch (e) {
    console.error(e);
    setStatus("model_failed");
  }
}

async function decodeAudio(file) {
  const raw = await file.arrayBuffer();
  const probe = new AudioContext();
  let decoded;
  try {
    decoded = await probe.decodeAudioData(raw);
  } finally {
    probe.close();
  }
  const frames = Math.ceil(decoded.duration * RATE);
  const offline = new OfflineAudioContext(1, frames, RATE);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start();
  const rendered = await offline.startRendering();
  return rendered.getChannelData(0);
}

function rmsFrames(audio, frameCount) {
  const samplesPerFrame = RATE / FPS;
  const values = new Float32Array(frameCount);
  for (let frame = 0; frame < frameCount; frame++) {
    const start = Math.round(frame * samplesPerFrame);
    const end = Math.min(audio.length, Math.round((frame + 1) * samplesPerFrame));
    if (end > start) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += audio[i] * audio[i];
      values[frame] = Math.sqrt(sum / (end - start));
    }
  }
  return values;
}

function percentile(sortedCopy, q) {
  const n = sortedCopy.length;
  if (n === 1) return sortedCopy[0];
  const pos = (q / 100) * (n - 1);
  const lo = Math.floor(pos);
  const hi = Math.ceil(pos);
  if (lo === hi) return sortedCopy[lo];
  return sortedCopy[lo] + (sortedCopy[hi] - sortedCopy[lo]) * (pos - lo);
}

function activeEnergy(audio, frameCount) {
  const values = rmsFrames(audio, frameCount);
  const smoothed = new Float32Array(frameCount);
  for (let i = 0; i < frameCount; i++) {
    let sum = 0;
    for (let k = -1; k <= 1; k++) {
      const j = i + k;
      if (j >= 0 && j < frameCount) sum += values[j];
    }
    smoothed[i] = sum / 3;
  }
  const sorted = Array.from(smoothed).sort((a, b) => a - b);
  const peak = Math.max(percentile(sorted, 92), 1e-8);
  const floor = percentile(sorted, 12);
  const threshold = Math.max(floor * 1.7, peak * 0.018);
  const level = new Float32Array(frameCount);
  const span = Math.max(peak - threshold, 1e-8);
  for (let i = 0; i < frameCount; i++) {
    level[i] = Math.min(1, Math.max(0, (smoothed[i] - threshold) / span));
  }
  return { level, threshold };
}

async function inferProbabilities(audio, progress) {
  const blankId = 0;
  const phoneIds = Object.values(PHONEME_VOCAB).filter(id => id !== blankId).sort((a, b) => a - b);
  const idToToken = {};
  for (const [token, id] of Object.entries(PHONEME_VOCAB)) idToToken[id] = token;
  const tokens = {};
  phoneIds.forEach((id, index) => { tokens[index] = idToToken[id]; });

  const starts = [];
  for (let s = 0; s < audio.length; s += STEP_SAMPLES) starts.push(s);
  const timesList = [];
  const probsList = [];
  let processed = 0;

  for (const start of starts) {
    const end = Math.min(audio.length, start + CHUNK_SAMPLES);
    const chunk = audio.subarray(start, end);
    if (chunk.length < RATE / 2) break;
    const input = new ort.Tensor("float32", Float32Array.from(chunk), [1, chunk.length]);
    const outputs = await session.run({ input_values: input });
    const logits = outputs.phoneme_logits;
    const T = logits.dims[1];
    const C = logits.dims[2];
    const data = logits.data;

    const reduced = new Float32Array(T * phoneIds.length);
    for (let t = 0; t < T; t++) {
      for (let p = 0; p < phoneIds.length; p++) {
        reduced[t * phoneIds.length + p] = data[t * C + phoneIds[p]];
      }
    }
    const pooled = new Float32Array(T * phoneIds.length);
    for (let p = 0; p < phoneIds.length; p++) {
      for (let t = 0; t < T; t++) {
        let sum = 0;
        for (let k = -2; k <= 2; k++) {
          const j = t + k;
          if (j >= 0 && j < T) sum += reduced[j * phoneIds.length + p];
        }
        pooled[t * phoneIds.length + p] = sum / 5;
      }
    }
    const probs = new Float32Array(T * phoneIds.length);
    for (let t = 0; t < T; t++) {
      let maxV = -Infinity;
      for (let p = 0; p < phoneIds.length; p++) maxV = Math.max(maxV, pooled[t * phoneIds.length + p]);
      let sum = 0;
      for (let p = 0; p < phoneIds.length; p++) {
        const e = Math.exp(pooled[t * phoneIds.length + p] - maxV);
        probs[t * phoneIds.length + p] = e;
        sum += e;
      }
      for (let p = 0; p < phoneIds.length; p++) probs[t * phoneIds.length + p] /= sum;
    }

    const step = chunk.length / RATE / T;
    const left = start === 0 ? 0 : OVERLAP_SAMPLES / RATE / 2;
    const right = end === audio.length ? chunk.length / RATE : chunk.length / RATE - left;
    for (let t = 0; t < T; t++) {
      const local = t * step;
      if (local >= left && local < right) {
        timesList.push(start / RATE + local);
        probsList.push(probs.subarray(t * phoneIds.length, (t + 1) * phoneIds.length));
      }
    }
    processed += 1;
    progress(Math.floor(processed / starts.length * 65));
    if (end === audio.length) break;
  }

  if (timesList.length === 0) throw new Error("too_short");
  return { times: timesList, probabilities: probsList, tokens, count: phoneIds.length };
}

function makeWeights(audio, times, probabilities, tokens, count, settings) {
  const frameCount = Math.max(2, Math.ceil(audio.length / RATE * FPS));
  const { level, threshold } = activeEnergy(audio, frameCount);
  const weights = Array.from({ length: frameCount }, () => new Float32Array(MORPHS.length));
  const morphIndex = {};
  MORPHS.forEach((m, i) => { morphIndex[m] = i; });
  const vowelIds = [];
  const closerIds = [];
  for (let index = 0; index < count; index++) {
    const token = tokens[index];
    if (token in VOWELS) vowelIds.push([index, VOWELS[token]]);
    if (CLOSERS.has(token)) closerIds.push(index);
  }

  let cursor = 0;
  for (let frame = 0; frame < frameCount; frame++) {
    const start = frame / FPS;
    const end = (frame + 1) / FPS;
    const selected = [];
    while (cursor > 0 && times[cursor - 1] >= start) cursor--;
    while (cursor < times.length && times[cursor] < start) cursor++;
    let scan = cursor;
    while (scan < times.length && times[scan] < end) { selected.push(scan); scan++; }
    if (selected.length === 0) {
      const mid = (start + end) / 2;
      let best = 0;
      let bestDist = Infinity;
      for (let i = 0; i < times.length; i++) {
        const d = Math.abs(times[i] - mid);
        if (d < bestDist) { bestDist = d; best = i; }
      }
      selected.push(best);
    }
    const current = new Float32Array(count);
    for (const i of selected) {
      const row = probabilities[i];
      for (let p = 0; p < count; p++) current[p] += row[p];
    }
    for (let p = 0; p < count; p++) current[p] /= selected.length;

    let closeScore = 0;
    for (const id of closerIds) closeScore += current[id];
    if (level[frame] < 0.055 || closeScore >= 0.50) continue;

    const scores = new Float32Array(MORPHS.length);
    for (const [id, morph] of vowelIds) scores[morphIndex[morph]] += current[id];
    let total = 0;
    for (let i = 0; i < scores.length; i++) total += scores[i];
    if (total < 0.055) continue;
    for (let i = 0; i < scores.length; i++) scores[i] /= total;

    let maxScore = 0;
    for (let i = 0; i < scores.length; i++) maxScore = Math.max(maxScore, scores[i]);
    const cutoff = maxScore * DOMINANT_RATIO;
    for (let i = 0; i < scores.length; i++) if (scores[i] < cutoff) scores[i] = 0;

    const order = Array.from(scores.keys()).sort((a, b) => scores[b] - scores[a]);
    for (let r = settings.shapes; r < order.length; r++) scores[order[r]] = 0;

    total = 0;
    for (let i = 0; i < scores.length; i++) total += scores[i];
    if (total <= 0) continue;
    for (let i = 0; i < scores.length; i++) scores[i] /= total;

    const gain = 0.16 + 0.84 * level[frame];
    for (let i = 0; i < scores.length; i++) weights[frame][i] = scores[i] * gain * settings.scales[i];
  }

  const result = Array.from({ length: frameCount }, () => new Float32Array(MORPHS.length));
  for (let frame = 0; frame < frameCount; frame++) {
    const previous = frame ? result[frame - 1] : new Float32Array(MORPHS.length);
    let hasCurrent = false;
    for (let i = 0; i < MORPHS.length; i++) if (weights[frame][i] > 0) { hasCurrent = true; break; }
    if (hasCurrent) {
      let hasPrevious = false;
      for (let i = 0; i < MORPHS.length; i++) if (previous[i] > 0) { hasPrevious = true; break; }
      for (let i = 0; i < MORPHS.length; i++) {
        result[frame][i] = hasPrevious ? previous[i] * 0.30 + weights[frame][i] * 0.70 : weights[frame][i];
      }
    } else {
      for (let i = 0; i < MORPHS.length; i++) {
        const v = previous[i] * RELEASE_DECAY;
        result[frame][i] = v < 0.02 ? 0 : v;
      }
    }
  }
  const lead = settings.lead;
  if (lead > 0) {
    for (let frame = 0; frame < frameCount - lead; frame++) {
      result[frame] = result[frame + lead];
    }
    for (let frame = Math.max(0, frameCount - lead); frame < frameCount; frame++) {
      result[frame] = new Float32Array(MORPHS.length);
    }
  } else if (lead < 0) {
    const delay = -lead;
    for (let frame = frameCount - 1; frame >= delay; frame--) {
      result[frame] = result[frame - delay];
    }
    for (let frame = 0; frame < Math.min(delay, frameCount); frame++) {
      result[frame] = new Float32Array(MORPHS.length);
    }
  }
  result[0] = new Float32Array(MORPHS.length);
  result[frameCount - 1] = new Float32Array(MORPHS.length);
  return { result, threshold };
}

function reduceMorphKeys(points) {
  if (points.length <= 2) return points;
  const keep = new Array(points.length).fill(false);
  keep[0] = true;
  keep[points.length - 1] = true;
  const stack = [[0, points.length - 1]];
  while (stack.length) {
    const [low, high] = stack.pop();
    if (high <= low + 1) continue;
    const [lowFrame, lowValue] = points[low];
    const [highFrame, highValue] = points[high];
    const span = highFrame - lowFrame;
    let worst = KEY_TOLERANCE;
    let chosen = -1;
    for (let frame = low + 1; frame < high; frame++) {
      const [currentFrame, currentValue] = points[frame];
      const predicted = span === 0 ? lowValue : lowValue + (highValue - lowValue) * (currentFrame - lowFrame) / span;
      const deviation = Math.abs(currentValue - predicted);
      if (deviation > worst) { worst = deviation; chosen = frame; }
    }
    if (chosen !== -1) {
      keep[chosen] = true;
      stack.push([low, chosen]);
      stack.push([chosen, high]);
    }
  }
  return points.filter((_, frame) => keep[frame]);
}

function fixedBytes(view, offset, bytes, size) {
  for (let i = 0; i < size; i++) view.setUint8(offset + i, i < bytes.length ? bytes[i] : 0);
  return offset + size;
}

function hexBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  return bytes;
}

function eyeMorphKeys(frameCount) {
  const entries = [];
  for (const track of EYE_MORPHS) {
    for (let base = 0; base < frameCount; base += EYE_PERIOD) {
      for (const [frame, value] of track.keys) {
        const target = base + frame;
        if (target < frameCount) entries.push([track.name, target, value]);
      }
    }
  }
  return entries;
}

function eyeBoneKeys(frameCount) {
  const entries = [];
  for (let base = 0; base < frameCount; base += EYE_PERIOD) {
    for (const [frame, pos, rot, interp] of EYE_BONE_KEYS) {
      const target = base + frame;
      if (target < frameCount) entries.push([target, pos, rot, interp]);
    }
  }
  return entries;
}

function writeVmd(weights, settings) {
  const frameCount = weights.length;
  const stride = settings.stride;
  const morphKeys = MORPHS.map((morph, index) => {
    const points = [];
    for (let frame = 0; frame < frameCount; frame += stride) points.push([frame, weights[frame][index]]);
    if (points[points.length - 1][0] !== frameCount - 1) points.push([frameCount - 1, weights[frameCount - 1][index]]);
    return [morph, reduceMorphKeys(points)];
  });
  let keyCount = 0;
  for (const [, keys] of morphKeys) keyCount += keys.length;
  const eyeMorphs = settings.eye ? eyeMorphKeys(frameCount) : [];
  const eyeBones = settings.eye ? eyeBoneKeys(frameCount) : [];
  keyCount += eyeMorphs.length;
  const size = 30 + 20 + 4 + eyeBones.length * 111 + 4 + keyCount * 23 + 16;
  const buffer = new ArrayBuffer(size);
  const view = new DataView(buffer);
  let offset = 0;
  const header = "Vocaloid Motion Data 0002";
  for (let i = 0; i < header.length; i++) view.setUint8(offset + i, header.charCodeAt(i));
  offset += 30;
  offset = fixedBytes(view, offset, VMD_MODEL_NAME_CP932, 20);
  view.setUint32(offset, eyeBones.length, true); offset += 4;
  for (const [frame, pos, rot, interp] of eyeBones) {
    offset = fixedBytes(view, offset, EYE_BONE_NAME, 15);
    view.setUint32(offset, frame, true); offset += 4;
    for (const v of pos) { view.setFloat32(offset, v, true); offset += 4; }
    for (const v of rot) { view.setFloat32(offset, v, true); offset += 4; }
    const ib = hexBytes(interp);
    for (let i = 0; i < 64; i++) view.setUint8(offset + i, ib[i]);
    offset += 64;
  }
  view.setUint32(offset, keyCount, true); offset += 4;
  for (const [morph, keys] of morphKeys) {
    for (const [frame, value] of keys) {
      offset = fixedBytes(view, offset, MORPH_CP932[morph], 15);
      view.setUint32(offset, frame, true); offset += 4;
      view.setFloat32(offset, value, true); offset += 4;
    }
  }
  for (const [name, frame, value] of eyeMorphs) {
    offset = fixedBytes(view, offset, name, 15);
    view.setUint32(offset, frame, true); offset += 4;
    view.setFloat32(offset, value, true); offset += 4;
  }
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;
  return buffer;
}

function download(buffer, name) {
  const blob = new Blob([buffer], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

runEl.addEventListener("click", async () => {
  if (!audioFile || !session || running) return;
  running = true;
  updateRunState();
  setProgress(0);
  try {
    let audio;
    try {
      audio = await decodeAudio(audioFile);
    } catch (e) {
      console.error(e);
      setStatus("decode_failed");
      return;
    }
    setProgress(5);
    setStatus("analysing");
    let inferred;
    try {
      inferred = await inferProbabilities(audio, setProgress);
    } catch (e) {
      console.error(e);
      setStatus(e.message === "too_short" ? "too_short" : "decode_failed");
      return;
    }
    setProgress(75);
    const settings = readSettings();
    const { result } = makeWeights(audio, inferred.times, inferred.probabilities, inferred.tokens, inferred.count, settings);
    setProgress(90);
    setStatus("writing");
    const vmd = writeVmd(result, settings);
    const stem = audioFile.name.replace(/\.[^.]+$/, "");
    download(vmd, stem + "_lipsync.vmd");
    setProgress(100);
    setStatus("done");
  } finally {
    running = false;
    updateRunState();
  }
});

applyLanguage();
loadModel();
</script>
